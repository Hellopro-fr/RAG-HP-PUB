[workspace]
resolver = "3"
members = ["crates/core", "crates/server"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "serde-well-known", "macros"] }
uuid = { version = "1.29", features = ["v7", "serde"] }
