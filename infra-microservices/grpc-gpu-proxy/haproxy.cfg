global
    log stdout format raw local0
    maxconn 4096

defaults
    mode tcp
    option tcplog
    log global
    timeout connect 5s
    timeout client  1h
    timeout server  1h

# DNS Docker embarqué (re-résout les noms de service si un conteneur redémarre)
resolvers docker
    nameserver dns1 127.0.0.11:53
    hold valid 10s

frontend f_llm
    bind *:15051
    default_backend b_llm
backend b_llm
    server llm llm-service:50051 resolvers docker init-addr none

frontend f_embedding
    bind *:15052
    default_backend b_embedding
backend b_embedding
    server emb embedding-model-service:50052 resolvers docker init-addr none

frontend f_reranking
    bind *:15053
    default_backend b_reranking
backend b_reranking
    server rer reranking-model-service:50053 resolvers docker init-addr none

frontend f_database
    bind *:15054
    default_backend b_database
backend b_database
    server db database-recherche-service:50054 resolvers docker init-addr none

# --- Extension famille graph-rag (ports internes reels != 50051, verifies via docker ps) ---

frontend f_graph_milvus
    bind *:15055
    default_backend b_graph_milvus
backend b_graph_milvus
    server gmilvus graph-rag-milvus-service:50056 resolvers docker init-addr none

frontend f_graph_database
    bind *:15056
    default_backend b_graph_database
backend b_graph_database
    server gdb graph-rag-database-connector-service:50055 resolvers docker init-addr none

frontend f_graph_normalization
    bind *:15057
    default_backend b_graph_normalization
backend b_graph_normalization
    server gnorm graph-rag-normalize-unite-service:50057 resolvers docker init-addr none

frontend f_graph_spacy
    bind *:15058
    default_backend b_graph_spacy
backend b_graph_spacy
    server gspacy graph-rag-spacy-service:50058 resolvers docker init-addr none
