[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hellopro-auth"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PyJWT>=2.8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hellopro_auth*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
