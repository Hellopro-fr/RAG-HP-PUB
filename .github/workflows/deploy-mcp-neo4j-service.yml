name: 'Deploy — mcp-neo4j-service'

# Wrapper qui appelle deploy-cloud-run.yml pour mcp-neo4j-service
# (Python mcp-proxy + mcp-neo4j-cypher, MCP graphe Neo4j, port 8587).
#
# Deploiement PARALLELE (shadow) : aucun trafic prod rerouté. mcp-gateway (VM)
# continue de pointer le container VM.
#
# *** DEPLOY AUTHENTIFIE (allow_unauthenticated: false) ***
# Raison : le service expose write_neo4j_cypher et il n'existe qu'une seule instance
# Neo4j (10.0.1.218 = prod). On NE veut PAS d'ecriture publique non-authentifiee sur
# le Neo4j prod. L'acces CR est donc gate par IAM (run.invoker + ID token).
# Test en LECTURE SEULE (get_neo4j_schema) via `gcloud auth print-identity-token`.
#
# Dependance : Neo4j interne bolt+s://10.0.1.218:7687 -> VPC Connector + private-ranges-only.
# Health = /status (mcp-proxy). Base python:3.11-slim -> gate Trivy off.

on:
  push:
    branches:
      - 'feat/migration-**'
    paths:
      - 'apps-microservices/mcp-neo4j-service/**'
      - '.github/workflows/deploy-mcp-neo4j-service.yml'
  workflow_dispatch:
    inputs:
      cloud_run_region:
        description: 'Région Cloud Run (override)'
        required: false
        type: string
        default: 'europe-west1'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: 'Deploy mcp-neo4j-service'
    uses: ./.github/workflows/deploy-cloud-run.yml
    with:
      service_name: mcp-neo4j-service
      dockerfile_path: apps-microservices/mcp-neo4j-service/Dockerfile
      build_context: .
      cloud_run_region: ${{ github.event.inputs.cloud_run_region || 'europe-west1' }}
      # *** AUTHENTIFIE : write_neo4j_cypher sur Neo4j prod -> pas d'expo publique ***
      ingress: all
      allow_unauthenticated: false
      cpu: '1'
      memory: '512Mi'
      min_instances: 0
      max_instances: 3
      container_port: 8587
      health_check_path: /status
      # Neo4j interne 10.0.1.218 -> VPC connector requis.
      vpc_connector: vpc-access-connector
      vpc_egress: private-ranges-only
      # Config Neo4j : neo4j:// (SANS TLS), aligne sur NEO4J_URI du .env/compose reel
      # (10.0.1.218 ne fait pas de TLS -> bolt+s reset le handshake). Cf. test 2026-07.
      # NB: si l'auth Neo4j echoue, verifier que platform-neo4j-password == mot de passe Neo4j.
      env_vars_json: |
        {
          "NEO4J_URI": "neo4j://10.0.1.218:7687",
          "NEO4J_USERNAME": "neo4j",
          "NEO4J_DATABASE": "neo4j"
        }
      secret_env_vars_json: '{"NEO4J_PASSWORD":"platform-neo4j-password:latest"}'
      trivy_disable_gate: true
    secrets:
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
