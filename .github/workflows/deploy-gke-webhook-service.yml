name: 'Deploy GKE — webhook-service'

# CD GKE (14/10, lot « autres ») : consumer migre en vague 1, deploye jusqu'ici a la main (image posee via Cloud Build).
# Un merge vers `prod` qui touche ce service (ou ce wrapper) reconstruit l'image depuis `prod`, la pousse (tag sha-<commit>),
# fait `kubectl set image` puis attend le rollout ; en cas d'echec, `rollout undo` (cf. deploy-gke-service.yml).
# Context build = RACINE (le Dockerfile copie libs/ et le service). Modele : deploy-gke-product-processor.yml.

on:
  push:
    branches: [prod]
    paths:
      - 'apps-microservices/webhook-service/**'
      - '.github/workflows/deploy-gke-webhook-service.yml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-gke-service.yml
    with:
      service_name: webhook-service
      dockerfile: apps-microservices/webhook-service/Dockerfile
      build_context: .
      deployment: webhook-service
      container: webhook-service
      namespace: apps-microservices
    secrets:
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
