name: 'Deploy — graph-rag-api-recherche-optim-service'

# Wrapper qui appelle deploy-cloud-run.yml pour graph-rag-api-recherche-optim-service
# (Python FastAPI, Graph RAG Search API — variante "optim", port 8525).
#
# Deploiement PARALLELE (shadow), zero trafic reroute.
#
# *** BATCH 3B — 2e service famille graph-rag ***
# Code quasi-identique a graph-rag-api-recherche-service (#21) : seul DEBUG_SCORING en moins.
# Memes deps -> enabler gRPC->GPU DEJA ETENDU a 8 ports (rien a changer cote infra) :
#   embedding (15052) · reranking (15053) · [llm 15051]
#   graph_milvus (15055) · graph_database (15056) · normalization (15057) · spacy (15058)
#   Neo4j direct via VPC : neo4j://10.0.1.218:7687 (SANS TLS).
# Gemini (egress) + API HelloPro (egress). Config a defauts + lifespan lazy -> startup safe.
# LECTURE SEULE (/query). CMD uvicorn mono-process -> pas d'override workers.

on:
  push:
    branches:
      - 'feat/migration-**'
    paths:
      - 'apps-microservices/graph-rag-api-recherche-optim-service/**'
      - '.github/workflows/deploy-graph-rag-api-recherche-optim-service.yml'
  workflow_dispatch:
    inputs:
      cloud_run_region:
        description: 'Région Cloud Run (override)'
        required: false
        type: string
        default: 'europe-west1'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: 'Deploy graph-rag-api-recherche-optim-service'
    uses: ./.github/workflows/deploy-cloud-run.yml
    with:
      service_name: graph-rag-api-recherche-optim-service
      dockerfile_path: apps-microservices/graph-rag-api-recherche-optim-service/Dockerfile
      build_context: .
      cloud_run_region: ${{ github.event.inputs.cloud_run_region || 'europe-west1' }}
      ingress: all
      allow_unauthenticated: true
      cpu: '1'
      memory: '1Gi'
      min_instances: 0
      max_instances: 3
      container_port: 8525
      startup_cpu_boost: true
      health_check_path: /health
      # *** VPC Connector requis : proxy gRPC (10.11.0.2) + Neo4j (10.0.1.218) internes ***
      vpc_connector: vpc-access-connector
      vpc_egress: private-ranges-only
      env_vars_json: |
        {
          "EMBEDDING_SERVICE_URL": "10.11.0.2:15052",
          "RERANKING_SERVICE_URL": "10.11.0.2:15053",
          "LLM_SERVICE_URL": "10.11.0.2:15051",
          "MILVUS_SERVICE_URL": "10.11.0.2:15055",
          "GRAPH_DATABASE_SERVICE_URL": "10.11.0.2:15056",
          "NORMALIZATION_SERVICE_URL": "10.11.0.2:15057",
          "SPACY_SERVICE_URL": "10.11.0.2:15058",
          "NEO4J_URI": "neo4j://10.0.1.218:7687",
          "NEO4J_USER": "neo4j",
          "NEO4J_DATABASE": "neo4j",
          "LLM_PROVIDER": "gemini",
          "SERVICE_NAME": "graph-rag-api-recherche-optim-service"
        }
      secret_env_vars_json: |
        {
          "NEO4J_PASSWORD": "platform-neo4j-password:latest",
          "GEMINI_API_KEY": "platform-gemini-api-key:latest",
          "HELLOPRO_API_BEARER_TOKEN": "platform-hellopro-api-bearer-token:latest"
        }
      trivy_disable_gate: true
    secrets:
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
