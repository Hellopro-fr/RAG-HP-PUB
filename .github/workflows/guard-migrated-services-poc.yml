permissions:
  contents: read

jobs:
  avertir:
    name: 'Service migré : livrer par une PR vers prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Dossiers migrés touchés
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          MIGRES: 'api-chat-llm api-comparaison-texte api-detection-langue-fr api-embedding-service api-question-caracteristique api-recherche content-extractor-api-service deepseek-metrics-collector-service devis-processor-service di-database-qdrant-service document-database-qdrant-service echange-database-qdrant-service echange-processor-service embedding-service graph-rag-api-recherche-optim-service graph-rag-api-recherche-rust-service graph-rag-api-recherche-service graph-rag-categorie-processor graph-rag-etl-processor graph-rag-fournisseur-processor graph-rag-llm-extractor-processor graph-rag-normalize-unite-processor graph-rag-normalize-unite-retry-processor graph-rag-produit-processor graph-rag-semantique-vigil-processor mcp-api-recherche-service mcp-google-analytics-service mcp-google-search-console-service mcp-leexi-service mcp-ringover-service mcp-semrush-service nettoyage-bruit-ocr-service optimize-service prix-caracterisation prix-extraction-devis prix-extraction-message prix-extraction-produits prix-milvus-processor prix-traitement product-database-qdrant-service product-processor-service QC-caracterisation QC-enrichissement QC-equivalence QC-generation-caracteristiques QC-generation-question1 QC-generation-question2aN QC-generation-valeurs template-llm-service webhook-service website-database-qdrant-service website-processor-service'
        run: |
          set -uo pipefail
          CHANGES=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null | cut -d/ -f2 | sort -u)
          TOUCHES=""
          for d in $MIGRES; do echo "$CHANGES" | grep -qx "$d" && TOUCHES="$TOUCHES $d"; done
          {
            echo "## ⚠️ Service migré modifié sur features/poc"
            echo ""
            echo "Ces services tournent sur Cloud Run / GKE : **ce changement ne part pas en production depuis features/poc**."
            echo "Pour le livrer, ouvrez la même modification en **PR vers \`prod\`** (le merge déclenche le CD du service)."
            echo ""
            for d in $TOUCHES; do echo "- \`apps-microservices/$d\`"; done
            echo ""
            echo "Guide : \`docs/runbooks/guide-livraison-services-migres.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
          for d in $TOUCHES; do
            echo "::warning title=Service migré::apps-microservices/$d est migré : ce changement ne part pas en production depuis features/poc. Livrez-le par une PR vers prod (guide docs/runbooks/guide-livraison-services-migres.md)."
          done
