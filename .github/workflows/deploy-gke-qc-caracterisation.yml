name: 'Deploy GKE — qc-caracterisation'

# CD GKE (14/10, lot « qc ») : consumer migre en vague 1, deploye jusqu'ici a la main (image posee via Cloud Build).
# Un merge vers `prod` qui touche ce service (ou ce wrapper) reconstruit l'image depuis `prod`, la pousse (tag sha-<commit>),
# fait `kubectl set image` puis attend le rollout ; en cas d'echec, `rollout undo` (cf. deploy-gke-service.yml).
# Context build = RACINE (le Dockerfile copie libs/ et le service). Modele : deploy-gke-product-processor.yml.

on:
  push:
    branches: [prod]
    paths:
      - 'apps-microservices/QC-caracterisation/**'
      - '.github/workflows/deploy-gke-qc-caracterisation.yml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-gke-service.yml
    with:
      service_name: qc-caracterisation
      dockerfile: apps-microservices/QC-caracterisation/Dockerfile
      build_context: .
      deployment: qc-caracterisation
      container: qc-caracterisation
      namespace: apps-microservices
