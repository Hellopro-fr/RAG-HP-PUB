name: 'Deploy — GKE service (réutilisable, shadow)'

# Workflow réutilisable (workflow_call) — CD SHADOW GKE (Phase C / anticipation S006).
#  - Auth WIF (SA github-deployer, zéro clé JSON)
#  - Build image Docker SUR LE RUNNER + push Artifact Registry (github-deployer a artifactregistry.writer ;
#    PAS de Cloud Build -> pas besoin de cloudbuild.builds.editor). Tag immuable sha-<gitsha>.
#  - Auth kubectl via Connect Gateway (github-deployer : container.clusterViewer + gkehub.gatewayEditor)
#  - Déploiement CHIRURGICAL : `kubectl set image` (préserve env/probes/secrets shadow) + rollout status
#  - Rollback auto : `kubectl rollout undo` si le rollout échoue
#  RBAC namespacé requis : Role/RoleBinding `github-deployer-gke-set-image` (ns cible) — cf. manifest/cicd/github-deployer-rbac.yaml
#  Trivy : volontairement absent au pilote (ajout à la généralisation CD3).
#  Slack (14/10) : notification de fin de déploiement, comme deploy-cloud-run.yml (skip si le secret est absent).

on:
  workflow_call:
    inputs:
      service_name:  { description: 'Nom AR de l image', required: true, type: string }
      dockerfile:    { description: 'Chemin Dockerfile (relatif racine repo)', required: true, type: string }
      build_context: { description: 'Contexte docker build', required: false, type: string, default: '.' }
      deployment:    { description: 'Nom du Deployment K8s', required: true, type: string }
      container:     { description: 'Nom du container dans le Deployment', required: true, type: string }
      namespace:     { description: 'Namespace K8s', required: false, type: string, default: 'apps-microservices' }
      cluster:       { description: 'Fleet membership / cluster (Connect Gateway)', required: false, type: string, default: 'matching-api-dev-k8s' }
    secrets:
      slack_webhook_url:
        description: 'URL Slack webhook pour notif post-deploy (optionnel)'
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: 'set-image ${{ inputs.deployment }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compute image tag
        id: tag
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@8254fb75a33b976a221574d287e93919e6a36f70 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Setup gcloud + kubectl
        uses: google-github-actions/setup-gcloud@f0990588f1e5b5af6827153b93673613abdc6ec7 # v2.1.4
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Docker auth to Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build + push image
        run: |
          set -euo pipefail
          IMG="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/hellopro/${{ inputs.service_name }}:${{ steps.tag.outputs.tag }}"
          docker build -f "${{ inputs.dockerfile }}" -t "$IMG" "${{ inputs.build_context }}"
          docker push "$IMG"
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      - name: kubectl creds via Connect Gateway
        run: |
          gcloud container fleet memberships get-credentials "${{ inputs.cluster }}" \
            --project "${{ vars.GCP_PROJECT_ID }}"

      - name: Set image + rollout (undo si échec)
        id: rollout
        run: |
          set -euo pipefail
          kubectl set image "deployment/${{ inputs.deployment }}" \
            "${{ inputs.container }}=${IMG}" -n "${{ inputs.namespace }}"
          if ! kubectl rollout status "deployment/${{ inputs.deployment }}" \
               -n "${{ inputs.namespace }}" --timeout=180s; then
            echo "::error::rollout KO — rollback (undo)"
            kubectl rollout undo "deployment/${{ inputs.deployment }}" -n "${{ inputs.namespace }}"
            exit 1
          fi

      - name: Verify live image
        run: |
          kubectl get "deployment/${{ inputs.deployment }}" -n "${{ inputs.namespace }}" \
            -o jsonpath='{range .spec.template.spec.containers[*]}{.name}={.image}{"\n"}{end}'

      - name: Summary + Slack notification (optionnel - skip si secret absent)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook_url }}
          JOB_STATUS: ${{ job.status }}
          ROLLOUT: ${{ steps.rollout.outcome }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then GLOBAL="success"; ICON=":white_check_mark:"
          elif [ "$ROLLOUT" = "failure" ]; then GLOBAL="rolled-back (rollout KO, undo)"; ICON=":rotating_light:"
          else GLOBAL="failed"; ICON=":x:"; fi
          {
            echo "## ${ICON} Deploy GKE — ${{ inputs.deployment }}"
            echo ""
            echo "| Champ | Valeur |"
            echo "|---|---|"
            echo "| Deployment | \`${{ inputs.namespace }}/${{ inputs.deployment }}\` |"
            echo "| Image | \`${IMG:-non construite}\` |"
            echo "| Rollout | ${ROLLOUT:-skipped} |"
            echo "| **Statut global** | **${GLOBAL}** |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "Slack webhook URL non configuré, skip notification."
            exit 0
          fi
          TEXT="${ICON} *Deploy GKE ${{ inputs.deployment }}* — ${GLOBAL}\n• Image: \`${IMG:-non construite}\`\n• Namespace: \`${{ inputs.namespace }}\`"
          PAYLOAD=$(printf '{"text":"%s","blocks":[{"type":"section","text":{"type":"mrkdwn","text":"%s"}}]}' "${ICON} *Deploy GKE ${{ inputs.deployment }}* — ${GLOBAL}" "$TEXT")
          curl -fsS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$SLACK_WEBHOOK_URL"
